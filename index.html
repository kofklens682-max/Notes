<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Notes, reminders, groceries and habits. Everything stays on this phone.">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- Stay upright: the installed app could otherwise start sideways or upside down. -->
  <script>try { screen.orientation.lock('portrait-primary').catch(function () {}); } catch (e) {}</script>
</head>
<body>
  <div id="stage"></div>

  <nav class="tabbar" id="tabbar">
    <div class="tabs" id="tabs">
      <span class="tab-ind" aria-hidden="true"></span>
      <button data-act="tab" data-tab="notes" aria-label="Notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11A1.5 1.5 0 0 1 19 5v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        <span>Notes</span>
      </button>
      <button data-act="tab" data-tab="planner" aria-label="Planner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7.5" r="2.6"/><path d="m4.8 7.6.9.9 1.6-1.8"/><path d="M11 7.5h9.5"/><circle cx="6" cy="16.5" r="2.6"/><path d="M11 16.5h9.5"/></svg>
        <span>Planner</span>
      </button>
    </div>
    <button class="fab" id="fab" data-act="new-note" aria-label="New note"></button>
  </nav>
  <script>
    // Draw the Folders screen at once from the copy saved last time (see saveFirst in main.js); the
    // app replaces it with the real, working screen as soon as it has loaded.
    try {
      var f = JSON.parse(localStorage.getItem('notes-first') || 'null');
      if (f && f.v === 1 && f.html) {
        if (f.theme) document.documentElement.setAttribute('data-theme', f.theme);
        document.getElementById('stage').innerHTML = '<section class="screen cur snap" data-s="folders" aria-hidden="true">' + f.html + '</section>';
        document.body.setAttribute('data-tab', 'notes');
        document.body.classList.add('snap');
        document.querySelector('#tabs [data-tab="notes"]').classList.add('on');
        document.getElementById('fab').innerHTML = f.fab || '';
      }
    } catch (e) { /* no copy yet: the app draws it normally */ }
  </script>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="lock-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="pick-photo" accept="image/*" multiple hidden>
  <input type="file" id="take-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" hidden>

  <script>
    // With a saved first screen on show, the app's code loads just after it has been drawn, so it
    // appears at once; the code runs in this order.
    (function () {
      var files = ['icons.js', 'js/config.js', 'js/store.js', 'js/remind.js', 'js/core.js', 'js/lock.js', 'js/notes.js', 'js/editor.js', 'js/planner.js', 'js/groceries.js', 'js/habits.js', 'js/notify.js', 'js/settings.js', 'js/main.js'], started = false;
      function go() {
        if (started) return;
        started = true;
        files.forEach(function (src) { var el = document.createElement('script'); el.src = src; el.async = false; document.body.appendChild(el); });
      }
      if (document.querySelector('.screen.snap')) { requestAnimationFrame(function () { setTimeout(go, 0); }); setTimeout(go, 60); } else go();
    })();
  </script>
</body>
</html>
