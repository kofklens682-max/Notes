<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Notes, reminders, groceries and habits. Everything stays on this phone.">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>

  <nav class="tabbar" id="tabbar">
    <div class="tabs" id="tabs">
      <span class="tab-ind" aria-hidden="true"></span>
      <button data-act="tab" data-tab="notes" aria-label="Notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11A1.5 1.5 0 0 1 19 5v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        <span>Notes</span>
      </button>
      <button data-act="tab" data-tab="planner" aria-label="Planner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7.5" r="2.6"/><path d="m4.8 7.6.9.9 1.6-1.8"/><path d="M11 7.5h9.5"/><circle cx="6" cy="16.5" r="2.6"/><path d="M11 16.5h9.5"/></svg>
        <span>Planner</span>
      </button>
    </div>
    <button class="fab" id="fab" data-act="new-note" aria-label="New note"></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="lock-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="pick-photo" accept="image/*" multiple hidden>
  <input type="file" id="take-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" hidden>

  <script src="icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/remind.js"></script>
  <script src="js/core.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/groceries.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
