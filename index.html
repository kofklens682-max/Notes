<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Notes, reminders, groceries and habits. Everything stays on this phone.">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="next.css">
  <!-- Stay upright: the installed app could otherwise start sideways or upside down. -->
  <script>try { screen.orientation.lock('portrait-primary').catch(function () {}); } catch (e) {}</script>
</head>
<body>
  <div id="stage"></div>

  <nav class="tabbar" id="tabbar">
    <div class="tabs" id="tabs">
      <span class="tab-ind" aria-hidden="true"></span>
      <button data-act="tab" data-tab="today" aria-label="Today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Today</span>
      </button>
      <button data-act="tab" data-tab="notes" aria-label="Notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11A1.5 1.5 0 0 1 19 5v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        <span>Notes</span>
      </button>
      <button data-act="tab" data-tab="goals" aria-label="Goals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg>
        <span>Goals</span>
      </button>
      <button data-act="tab" data-tab="search" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Search</span>
      </button>
    </div>
    <button class="fab" id="fab" data-act="new-note" aria-label="New note"></button>
  </nav>
  

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="lock-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="pick-photo" accept="image/*" multiple hidden>
  <input type="file" id="take-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="solve-photo" accept="image/*" hidden>
  <input type="file" id="ocr-pick" accept="image/*" hidden>
  <input type="file" id="ocr-take" accept="image/*" capture="environment" hidden>
  <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" hidden>

  <script>
    // With a saved first screen on show, the app's code loads just after it has been drawn, so it
    // appears at once; the code runs in this order.
    (function () {
      var files = ['icons.js', 'js/config.js', 'js/store.js', 'js/remind.js', 'js/account.js', 'js/core.js', 'js/lock.js', 'js/notes.js', 'js/editor.js', 'js/table.js', 'js/mathsolve.js', 'js/draw.js', 'js/maths.js', 'js/photo.js', 'js/aiwrite.js', 'js/planner.js', 'js/today.js', 'js/cards.js', 'js/groceries.js', 'js/habits.js', 'js/notify.js', 'js/settings.js', 'js/acctui.js', 'js/next.js', 'js/updatenow.js', 'js/main.js'], started = false;
      function go() {
        if (started) return;
        started = true;
        files.forEach(function (src) { var el = document.createElement('script'); el.src = src; el.async = false; document.body.appendChild(el); });
      }
      if (document.querySelector('.screen.snap')) { requestAnimationFrame(function () { setTimeout(go, 0); }); setTimeout(go, 60); } else go();
    })();
  </script>
  <script>
    // Self-repair: if nothing was drawn after 6 seconds (a broken saved copy of the app files), clear that copy once and reload. Your data is not touched.
    setTimeout(function () {
      var r = document.getElementById("stage"); if (r && r.children.length) return;
      try { if (sessionStorage.getItem("selfheal")) return; sessionStorage.setItem("selfheal", "1"); } catch (e) { return; }
      (async function () {
        try { var reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.unregister(); } catch (e) { /* none */ }
        try { var ks = await caches.keys(); for (var k of ks) if (k.indexOf("notes-") === 0 && k !== "teacher-media") await caches.delete(k); } catch (e) { /* none */ }
        location.replace(location.pathname + "?fresh=" + Date.now());
      })();
    }, 6000);
  </script>
</body>
</html>
